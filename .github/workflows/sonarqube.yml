name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      # Java, Maven and Bun at the versions pinned in mise.toml
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      # jOOQ sources are generated from a PostgreSQL container (-Pcodegen), so the build needs Docker, which the runner has
      - name: Build and test
        run: mvn -B -Pcodegen verify
      - name: Admin UI tests
        working-directory: src/main/webui
        run: |
          bun install --frozen-lockfile
          bun test --coverage --coverage-reporter=lcov
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # the scanner needs compiled classes for Java; node_modules and the built admin UI are not our code
          args: >
            -Dsonar.organization=asm0dey
            -Dsonar.projectKey=asm0dey_stillpress
            -Dsonar.sources=src/main
            -Dsonar.tests=src/test,src/main/webui/src
            -Dsonar.test.inclusions=src/test/**,src/main/webui/src/**/*.test.ts
            -Dsonar.java.binaries=target/classes
            -Dsonar.java.test.binaries=target/test-classes
            -Dsonar.exclusions=src/main/webui/node_modules/**,src/main/webui/dist/**,src/main/webui/coverage/**,**/*.test.ts
            -Dsonar.coverage.jacoco.xmlReportPaths=target/jacoco-report/jacoco.xml
            -Dsonar.javascript.lcov.reportPaths=src/main/webui/coverage/lcov.info
