name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      # Java, Maven and Bun at the versions pinned in mise.toml
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      # jOOQ sources are generated from a PostgreSQL container (-Pcodegen), so the build needs Docker, which the runner has
      - name: Build and test
        run: mvn -B -Pcodegen verify
      - name: Admin UI tests
        working-directory: src/main/webui
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run test --coverage --coverage.reporter=lcov
      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # the scanner needs compiled classes for Java; node_modules and the built admin UI are not our code.
          # Qute strips the parameter-declaration lines above <?xml in the feed templates (TemplatesTest checks it)
          args: >
            -Dsonar.organization=asm0dey
            -Dsonar.projectKey=asm0dey_stillpress
            -Dsonar.sources=src/main
            -Dsonar.tests=src/test,src/main/webui/src
            -Dsonar.test.inclusions=src/test/**,src/main/webui/src/**/*.test.ts,src/main/webui/src/**/*.test.tsx,src/main/webui/src/testapi.ts,src/main/webui/src/editor/testwxr.ts
            -Dsonar.java.binaries=target/classes
            -Dsonar.java.test.binaries=target/test-classes
            -Dsonar.exclusions=src/main/webui/node_modules/**,src/main/webui/dist/**,src/main/webui/coverage/**,**/*.test.ts,**/*.test.tsx,src/main/webui/src/testapi.ts,src/main/webui/src/editor/testwxr.ts
            -Dsonar.coverage.jacoco.xmlReportPaths=target/jacoco-report/jacoco.xml
            -Dsonar.javascript.lcov.reportPaths=src/main/webui/coverage/lcov.info
            -Dsonar.issue.ignore.multicriteria=feedProlog
            -Dsonar.issue.ignore.multicriteria.feedProlog.ruleKey=xml:S1778
            -Dsonar.issue.ignore.multicriteria.feedProlog.resourceKey=src/main/resources/templates/feed/*.xml
