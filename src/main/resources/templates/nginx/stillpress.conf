# Generated by `stillpress nginx-config`. Include it inside your server { } block (after listen, server_name, TLS).
# It holds no site data, so publishing never needs an nginx reload.
root {root};
index index.html;
charset utf-8;

# legacy ?p= / ?page_id= / ?attachment_id= links on any path go to the redirect map
error_page 418 = @stillpress;
if ($args ~* "(^|&)(p|page_id|attachment_id)=") {
    return 418;
}
{#for loc in proxied}

location {loc} {
    proxy_pass http://{upstream};
    # $http_host keeps a non-standard port; X-Forwarded-For is overwritten, never appended to, so a client cannot spoof its IP
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    client_max_body_size 1g;
}
{/for}

# a path without a trailing slash is only ever a file; a directory falls through so Stillpress sends WordPress's 301
location / {
    try_files $uri @stillpress;
    add_header Cache-Control "{shortCache}";
    add_header X-Content-Type-Options nosniff;
}

location ~ "/{feed}/$" {
    default_type "application/rss+xml; charset=UTF-8";
    types { }
    try_files $\{uri}index.html @stillpress;
    add_header Cache-Control "{shortCache}";
    add_header X-Content-Type-Options nosniff;
}

# after the feed regex: the first matching regex wins
location ~ "/$" {
    try_files $\{uri}index.html @stillpress;
    add_header Cache-Control "{shortCache}";
    add_header X-Content-Type-Options nosniff;
}

# plain prefixes, so a directory URL here still reaches the "/$" regex above instead of nginx's 403
location /media/ {
    try_files $uri @stillpress;
    add_header Cache-Control "{longCache}";
    add_header X-Content-Type-Options nosniff;
}

location /assets/ {
    try_files $uri @stillpress;
    add_header Cache-Control "{longCache}";
    add_header X-Content-Type-Options nosniff;
}
