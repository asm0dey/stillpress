stillpress.data-dir=${STILLPRESS_DATA_DIR:./data}
quarkus.datasource.db-kind=h2
# H2 in the built-in profiles only: the pg test profile (PostgresProfile) leaves the URL unset so Dev Services
# supplies PostgreSQL, whose URL ranks below this file and would otherwise lose to it
%dev,test,prod.quarkus.datasource.jdbc.url=jdbc:h2:file:${stillpress.data-dir}/stillpress;AUTO_SERVER=TRUE;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=KEY,VALUE;LOCK_TIMEOUT=3600000
# Dialect follows the datasource: PostgreSQL = db-kind=postgresql + the JDBC URL.
quarkus.jooq.dialect=${quarkus.datasource.db-kind}
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration/common
quarkus.http.port=8080
# client IP and scheme (Secure cookies) come from forwarded headers, trusted only from these proxies;
# IPv6 needs brackets: a bare ::1 is taken for a host name and resolved on every request
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.enable-forwarded-host=true
quarkus.http.proxy.trusted-proxies=${STILLPRESS_TRUSTED_PROXIES:127.0.0.1,[::1]}
# WXR uploads (the real blog's is 13.6 MB) and later media uploads
quarkus.http.limits.max-body-size=1G
# only the upload may be that large: anonymous uploads are refused before the body is read (ImportResource keeps
# @RolesAllowed), and BodyLimitFilter caps every other admin API body
quarkus.http.auth.permission.import-upload.paths=/admin/api/import
quarkus.http.auth.permission.import-upload.policy=authenticated
quarkus.http.auth.permission.media-upload.paths=/admin/api/media
quarkus.http.auth.permission.media-upload.policy=authenticated
# CSRF (quarkus-rest-csrf), signed: KeysConfigSourceFactory supplies token-signature-key from the Tink PRF keyset.
# A GET to a REST endpoint (the admin UI's first call is GET /admin/api/setup) without a token issues one: the raw
# token in the X-CSRF-TOKEN response header (CsrfTokenHeader), its HMAC in the HttpOnly csrf-token cookie. Every other
# method must send the raw token in X-CSRF-TOKEN, whatever the body type, or gets 400. The cookie lives as long as a
# session.
quarkus.rest-csrf.cookie-max-age=14D

%test,pg.stillpress.data-dir=./target/test-data/${quarkus.uuid}

# Flyway warns that H2 2.5.x is newer than its verified 2.3.232; the newer H2 works, so hide only that message.
quarkus.log.category."org.flywaydb.core.internal.database.base.Database".level=ERROR

# templates/nginx/stillpress.conf is plain text; without this Qute warns about it at every start
quarkus.qute.content-types.conf=text/plain

# db-scheduler has no H2 overrides and warns about it on every start, even with alwaysPersistTimestampInUTC() (Jobs)
# set; this is its silenceable logger for exactly that message.
quarkus.log.category."com.github.kagkarlsson.scheduler.jdbc.AutodetectJdbcCustomization.utc_warning".level=ERROR

# Hide jOOQ's "tip of the day" banner.
quarkus.log.category."org.jooq.Constants".level=WARN

# Admin SPA (src/main/webui), built by Bun through Quinoa and served under /admin
quarkus.quinoa.ui-root-path=/admin
quarkus.quinoa.build-dir=dist
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.package-manager-install=true
# must equal bun in mise.toml (BunVersionPinTest)
quarkus.quinoa.package-manager-install.bun-version=1.4.4
# relative to ui-root-path: /admin/api and /admin/preview (AdminShellTest)
quarkus.quinoa.ignored-path-prefixes=/api,/preview
# Quinoa stays off in tests: every test profile would rebuild the UI. AdminShellTest turns it on in its own profile.

# how often the sweep looks for queued changes whose publish request was lost; a row must be this old to count
stillpress.publish.sweep-interval=1m
%test.stillpress.publish.sweep-interval=2s
# how often db-scheduler looks for due tasks (scheduled go-live, the sweep, retries)
stillpress.publish.polling-interval=10s
%test.stillpress.publish.polling-interval=500ms

# CAPTCHA on the public admin forms (login, password reset, set-password, setup). Unset: the admin's Settings decide.
# Set: the provider is locked to it, and Turnstile keys come only from here.
stillpress.captcha.provider=${STILLPRESS_CAPTCHA_PROVIDER:}
stillpress.captcha.turnstile.site-key=${STILLPRESS_TURNSTILE_SITE_KEY:}
stillpress.captcha.turnstile.secret=${STILLPRESS_TURNSTILE_SECRET:}
stillpress.captcha.turnstile.verify-url=https://challenges.cloudflare.com/turnstile/v0/siteverify
stillpress.captcha.turnstile.timeout=10s
# WireMock on a fixed port (Altchas.TURNSTILE_PORT); a short timeout so the slow-answer test stays quick
%test.stillpress.captcha.turnstile.verify-url=http://localhost:8093/siteverify
%test.stillpress.captcha.turnstile.timeout=1s

# TODO(Task 7): remove when a WebAuthnUserProvider exists; the extension fails the build without one
quarkus.webauthn.enabled=false
