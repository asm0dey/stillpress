stillpress.data-dir=${STILLPRESS_DATA_DIR:./data}
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:${stillpress.data-dir}/stillpress;AUTO_SERVER=FALSE;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=KEY,VALUE
# For PostgreSQL set quarkus.datasource.db-kind=postgresql, the URL and quarkus.jooq.dialect=POSTGRES.
quarkus.jooq.dialect=H2
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration/common
quarkus.http.port=8080

%test.stillpress.data-dir=./target/test-data/${quarkus.uuid}
