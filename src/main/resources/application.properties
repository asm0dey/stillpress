stillpress.data-dir=${STILLPRESS_DATA_DIR:./data}
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:${stillpress.data-dir}/stillpress;AUTO_SERVER=TRUE;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=KEY,VALUE
# Dialect follows the datasource: PostgreSQL = db-kind=postgresql + the JDBC URL.
quarkus.jooq.dialect=${quarkus.datasource.db-kind}
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration/common
quarkus.http.port=8080
# client IP and scheme (Secure cookies) come from forwarded headers, trusted only from these proxies;
# IPv6 needs brackets: a bare ::1 is taken for a host name and resolved on every request
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.enable-forwarded-host=true
quarkus.http.proxy.trusted-proxies=${STILLPRESS_TRUSTED_PROXIES:127.0.0.1,[::1]}
# WXR uploads (the real blog's is 13.6 MB) and later media uploads
quarkus.http.limits.max-body-size=1G

%test.stillpress.data-dir=./target/test-data/${quarkus.uuid}

# Flyway warns that H2 2.5.x is newer than its verified 2.3.232; the newer H2 works, so hide only that message.
quarkus.log.category."org.flywaydb.core.internal.database.base.Database".level=ERROR

# Hide jOOQ's "tip of the day" banner.
quarkus.log.category."org.jooq.Constants".level=WARN
