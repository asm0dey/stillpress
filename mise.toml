[tools]
java = "liberica-25.0.5.0.3+5"
maven = "3.9.16"
bun = "1.4.4"

[tasks."i18n:wp"]
description = "Refresh the WordPress Russian translation snapshot (Gutenberg's strings) after a Gutenberg upgrade"
dir = "src/main/webui"
run = """
full=$(mktemp)
trap 'rm -f "$full"' EXIT
# the filter scans node_modules/@wordpress, so it must match bun.lock
bun install --frozen-lockfile
curl -fsSL 'https://translate.wordpress.org/projects/wp/dev/ru/default/export-translations/?format=jed1x' -o "$full"
bun scripts/filter-wp-ru.ts "$full" src/i18n/wp-ru.json
"""

[tasks."test:ui"]
description = "Run the admin UI's unit tests (bun test); mvn verify does not run them"
dir = "src/main/webui"
run = "bun test"

[tasks.verify]
description = "The full check before pushing: mvn verify, then the admin UI's unit tests"
run = "mvn -q verify && cd src/main/webui && bun test"
